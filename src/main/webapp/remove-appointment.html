<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remove Appointment - Sunrise Dental</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f6fa; }

        header {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { color: #667eea; }
        .btn-logout {
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .container { display: flex; min-height: calc(100vh - 70px); }

        .sidebar {
            width: 250px;
            background: white;
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .sidebar a {
            display: block;
            padding: 15px 25px;
            color: #555;
            text-decoration: none;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #e8eaff;
            color: #667eea;
        }

        .main-content { flex: 1; padding: 30px; }

        .appointment-list {
            display: grid;
            gap: 15px;
        }

        .appointment-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .appointment-info h3 { color: #333; margin-bottom: 5px; }
        .appointment-info p { color: #666; font-size: 14px; }

        .btn-delete {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-delete:hover { background: #c82333; }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #888;
        }
    </style>
</head>
<body>
<header>
    <h1>🦷 Sunrise Dental Clinic</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
</header>

<div class="container">
    <nav class="sidebar">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="manage-appointments.html">📋 Manage Appointments</a>
        <a href="add-appointment.html">➕ Add Appointment</a>
        <a href="remove-appointment.html" class="active">🗑️ Remove Appointment</a>
        <a href="search.html">🔍 Search Patient</a>
    </nav>

    <main class="main-content">
        <h2>Remove Appointments</h2>
        <br>

        <div class="appointment-list" id="appointmentList">
            <!-- Appointments will be loaded here -->
        </div>
    </main>
</div>

<script>
    if (!sessionStorage.getItem('isLoggedIn')) {
        window.location.href = 'login.html';
    }

    // Load appointments
    function loadAppointments() {
        var appointments = JSON.parse(localStorage.getItem('appointments') || '[]');
        var listDiv = document.getElementById('appointmentList');

        if (appointments.length === 0) {
            listDiv.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 50px;">🗑️</p>
                        <h3>No Appointments to Remove</h3>
                    </div>
                `;
            return;
        }

        listDiv.innerHTML = '';

        appointments.forEach(function(app, index) {
            var card = document.createElement('div');
            card.className = 'appointment-card';
            card.innerHTML = `
                    <div class="appointment-info">
                        <h3>${app.patientName}</h3>
                        <p>📋 ${app.appointmentNumber} | 🦷 ${app.dentist}</p>
                        <p>📅 ${app.appointmentDate} at ${app.appointmentTime}</p>
                        <p>💊 ${app.treatments.join(', ')}</p>
                    </div>
                    <button class="btn-delete" onclick="deleteAppointment(${index})">
                        🗑️ Remove
                    </button>
                `;
            listDiv.appendChild(card);
        });
    }

    function deleteAppointment(index) {
        if (confirm('Are you sure you want to delete this appointment?')) {
            var appointments = JSON.parse(localStorage.getItem('appointments') || '[]');
            appointments.splice(index, 1);
            localStorage.setItem('appointments', JSON.stringify(appointments));
            loadAppointments();
            alert('Appointment deleted successfully!');
        }
    }

    loadAppointments();

    function logout() {
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
